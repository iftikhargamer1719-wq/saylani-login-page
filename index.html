<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saylani Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="login-section">

            <div class="logo">
                <img src="./logo.png" alt="Saylani Welfare Logo">
            </div>

            <h1>Log into your Account</h1>

            <form id="loginForm">

                <div class="input-box">
                    <span class="input-icon" aria-hidden="true">
                        <svg viewBox="0 0 20 17">
                            <path d="M2 2h16v13H2z" fill="none" stroke="currentColor" stroke-width="1.5" />
                            <path d="m2 3 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.5" />
                        </svg>
                    </span>

                    <input type="email" id="email" name="email" placeholder="iamchis_welfare@gmail.com"
                        aria-label="Email address" autocomplete="email" required>
                </div>

                <div class="input-box">
                    <span class="input-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <rect x="5" y="10" width="14" height="11" rx="2" fill="none" stroke="currentColor"
                                stroke-width="1.7" />
                            <path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.7" />
                            <circle cx="12" cy="15" r="1" fill="currentColor" />
                        </svg>
                    </span>

                    <input type="password" id="password" name="password" placeholder="Password" aria-label="Password"
                        autocomplete="current-password" required>

                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor"
                                stroke-width="1.6" />
                            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
                        </svg>
                    </button>
                </div>

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    Sign in
                </button>

            </form>

            <div class="divider">
                <span></span>
                <p>or</p>
                <span></span>
            </div>

            <button type="button" class="social-btn">
                <span class="social-icon google">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4285F4"
                            d="M22.5 12.23c0-.71-.06-1.4-.18-2.06H12v3.9h5.9a5.05 5.05 0 0 1-2.19 3.31v2.7h3.46c2.03-1.87 3.33-4.62 3.33-7.85Z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.47-.98 7.29-2.65l-3.46-2.7c-.97.65-2.2 1.03-3.83 1.03-2.94 0-5.44-1.98-6.33-4.65H2.1v2.79A11 11 0 0 0 12 23Z" />
                        <path fill="#FBBC05"
                            d="M5.67 14.03A6.62 6.62 0 0 1 5.32 12c0-.7.12-1.39.35-2.03V7.18H2.1A11 11 0 0 0 1 12c0 1.77.42 3.44 1.1 4.82l3.57-2.79Z" />
                        <path fill="#EA4335"
                            d="M12 5.32c1.62 0 3.07.56 4.21 1.67l3.16-3.16C17.46 2.06 14.97 1 12 1a11 11 0 0 0-9.9 6.18l3.57 2.79C6.56 7.3 9.06 5.32 12 5.32Z" />
                    </svg>
                </span>
                Sign in with Google
            </button>

            <button type="button" class="social-btn">
                <span class="social-icon facebook">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4267B2"
                            d="M24 12a12 12 0 1 0-13.88 11.86v-8.39H7.08V12h3.04V9.36c0-3 1.79-4.66 4.52-4.66 1.31 0 2.68.24 2.68.24v2.95h-1.51c-1.49 0-1.95.93-1.95 1.88V12h3.32l-.53 3.47h-2.79v8.39A12 12 0 0 0 24 12Z" />
                    </svg>
                </span>
                Sign in with Facebook
            </button>

            <button type="button" class="social-btn">
                <span class="social-icon apple">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#FFFFFF"
                            d="M16.37 12.59c.02 2.26 1.98 3.02 2 3.03-.02.05-.31 1.08-1.03 2.14-.62.91-1.27 1.81-2.29 1.83-1 .02-1.33-.59-2.48-.59-1.15 0-1.52.57-2.46.61-.99.04-1.75-.99-2.37-1.89-1.29-1.87-2.27-5.29-.95-7.6.65-1.15 1.81-1.88 3.06-1.9.95-.02 1.85.65 2.44.65.59 0 1.69-.8 2.85-.68.48.02 1.83.19 2.7 1.44-.07.04-1.61.94-1.59 2.96ZM14.5 6.9c.52-.63.87-1.5.78-2.37-.75.03-1.65.5-2.19 1.13-.48.55-.9 1.44-.79 2.29.84.06 1.69-.43 2.2-1.05Z" />
                    </svg>
                </span>
                Sign in with Apple
            </button>

            <p class="signup">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>

        </section>

        <section class="image-section">
            <img src="./learning.jpg" alt="Student learning online">
        </section>

    </main>

</body>

</html>
